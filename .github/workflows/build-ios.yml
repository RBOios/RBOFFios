name: Build unsigned IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd ios && xcodegen generate
      - name: Build (no signing)
        run: |
          cd ios
          xcodebuild -project RBOiOS.xcodeproj -scheme RBOiOS -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          cd ios
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/RBOiOS.app Payload/
          zip -qr RBO-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: RBO-unsigned-ipa, path: ios/RBO-unsigned.ipa }
